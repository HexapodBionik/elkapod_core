name: elkapod-core

x-vol-x11: &vol-x11 /tmp/.X11-unix:/tmp/.X11-unix:rw
x-vol-shm: &vol-shm /dev/shm:/dev/shm:rw
x-vol-xauth: &vol-xauth ${HOME}/.Xauthority:/root/.Xauthority:rw

x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      BASE_IMAGE: ghcr.io/hexapodbionik/elkapod-ros-jazzy-base:${BASE_TAG:-latest}
  image: ghcr.io/hexapodbionik/elkapod-core:${TAG:-latest}
  network_mode: host
  ipc: host
  shm_size: "1g"
  stdin_open: true
  tty: true
  environment:
    TERM: xterm-256color
    DISPLAY: ${DISPLAY}
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

services:
  elkapod_core:
    <<: *common
    volumes:
      - *vol-x11
      - *vol-shm
      - *vol-xauth
    command: ["bash"]

  dev:
    <<: *common
    profiles: ["dev"]
    volumes:
      - *vol-x11
      - *vol-shm
      - *vol-xauth
      - ./:/ws/src/elkapod_core
    command: ["bash"]
