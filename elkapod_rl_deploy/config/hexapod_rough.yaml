# Elkapod rough-terrain (height-scan) policy deployment config. Must mirror the training environment
# (ElkapodRoughEnvCfg, run hexapod_rough_v5).

# Articulated (non-fixed) joints in Isaac Lab articulation order.
# Verify after any asset change: env.unwrapped.scene["robot"].data.joint_names
obs_joint_names:
  - leg1_J1
  - leg2_J1
  - leg3_J1
  - leg4_J1
  - leg5_J1
  - leg6_J1
  - leg1_J2
  - leg2_J2
  - leg3_J2
  - leg4_J2
  - leg5_J2
  - leg6_J2
  - leg1_J3
  - leg2_J3
  - leg3_J3
  - leg4_J3
  - leg5_J3
  - leg6_J3

# Joints the policy outputs targets for, in JointPositionActionCfg order.
action_joint_names:
  - leg1_J1
  - leg2_J1
  - leg3_J1
  - leg4_J1
  - leg5_J1
  - leg6_J1
  - leg1_J2
  - leg2_J2
  - leg3_J2
  - leg4_J2
  - leg5_J2
  - leg6_J2
  - leg1_J3
  - leg2_J3
  - leg3_J3
  - leg4_J3
  - leg5_J3
  - leg6_J3

# ELKAPOD_CFG.init_state.joint_pos, in action_joint_names order.
default_joint_pos:
  - 0.0  # leg1_J1
  - 0.0  # leg2_J1
  - 0.0  # leg3_J1
  - 0.0  # leg4_J1
  - 0.0  # leg5_J1
  - 0.0  # leg6_J1
  - 0.4  # leg1_J2
  - 0.4  # leg2_J2
  - 0.4  # leg3_J2
  - 0.4  # leg4_J2
  - 0.4  # leg5_J2
  - 0.4  # leg6_J2
  - -1.8 # leg1_J3
  - -1.8 # leg2_J3
  - -1.8 # leg3_J3
  - -1.8 # leg4_J3
  - -1.8 # leg5_J3
  - -1.8 # leg6_J3

action_scale: 0.2
clip_actions: 100.0


use_cuda: true

# 1 / (sim.dt * decimation)
control_rate_hz: 50.0

use_gait_phase: true
gait_freq: 1.5
gait_step_dt: 0.02      # sim.dt * decimation
# mdp.gait_leg_clock: [sin x6, cos x6] of each leg's phase (leg1..leg6)
gait_clock: per_leg
gait_phase_offsets: [0.0, 0.5, 0.5, 0.0, 0.0, 0.5]  # mdp/clock.py TRIPOD_OFFSETS

# true if training used mdp.joint_pos_rel / mdp.joint_vel_rel
joint_pos_relative: false
joint_vel_relative: false

# Set false if the Action Graph already publishes body-frame twist.
rotate_odom_to_body: true

# Diagnostic only: feeds zero base/joint velocities to the policy.
debug_zero_velocities: false
debug_obs_dump: true
debug_obs_dump_every_n_steps: 50

# Policy network (skrl agent.yaml: models.policy.network).
hidden_sizes: [512, 256, 128]
activation: elu
height_encoder:
  convs:
    - {out_channels: 16, kernel_size: 5, stride: 2, padding: 2}  # 25 -> 13
    - {out_channels: 32, kernel_size: 3, stride: 2, padding: 1}  # 13 -> 7
  features: 64

# Mirrors the height_scanner RayCasterCfg (GridPatternCfg, ray_alignment="yaw") and the
# height_scan ObsTerm: h = base_z - ground_z - offset, clipped.
height_scan:
  size: [1.2, 1.2]
  resolution: 0.05
  ordering: xy
  offset: 0.1887           # ELKAPOD_STAND_HEIGHT
  clip: [-1.0, 1.0]
  # Ground heights from elevation_mapping_cupy.
  grid_map_topic: /elevation_mapping_node/elevation_map_filter
  layer: inpaint
  base_frame: body_link    # RayCaster prim in training
  # Older map / missing TF -> flat height scan (all zeros).
  map_timeout_s: 1.0
  # Hold the default pose until the first map arrives.
  require_map_to_start: true
